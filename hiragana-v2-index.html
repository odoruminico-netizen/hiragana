C544.');let p=await Notification.requestPermission();data.reminder.enabled=p==='granted';save();alert(p==='granted'?'\uC54C\uB9BC \uAD8C\uD55C\uC744 \uD5C8\uC6A9\uD588\uC5B4. \uC815\uAE30 \uD478\uC2DC\uB294 \uB2E4\uC74C \uB2E8\uACC4\uC5D0\uC11C Cloudflare \uC5F0\uACB0\uC774 \uD544\uC694\uD574.':'\uC54C\uB9BC \uAD8C\uD55C\uC774 \uD5C8\uC6A9\uB418\uC9C0 \uC54A\uC558\uC5B4.')};$('#reset').onclick=()=>{if(confirm('\uD559\uC2B5 \uAE30\uB85D\uC744 \uC804\uBD80 \uC9C0\uC6B8\uAE4C?')){localStorage.removeItem(STORAGE);location.reload()}}}
