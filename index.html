function renderWelcome(){app.innerHTML='<main class="page"><section class="hero"><div class="brand-pill">HIRAGANADA ver3.1</div><div class="logo-art"><img src="'+APP_ICON+'" alt="Hiraganada"></div><h1>히라가나다라마바사</h1><p>우주 전쟁처럼 놀면서 히라가나를 외우자!</p></section><section class="card"><div class="profile-grid"><div><label style="font-size:12px;font-weight:900">이름</label><input id="name" class="input" placeholder="예: Sunny"></div><div class="age"><label style="font-size:12px;font-weight:900">나이</label><select id="age">'+[8,9,10,11,12,13].map(function(n){return '<option>'+n+'</option>'}).join('')+'</select></div></div><div style="font-weight:900;margin-top:12px">내 캐릭터</div><div class="avatars"><button class="on">👨‍🚀</button><button>👩‍🚀</button><button>🧑‍🚀</button><button>👽</button></div><button id="start" class="primary" style="margin-top:12px">모험 시작하기 ▶</button></section>'+footer()+'</main>';byId('start').onclick=function(){var n=byId('name').value.replace(/^\s+|\s+$/g,'');if(!n)return alert('이름을 적어줘!');data.profile={name:n,age:parseInt(byId('age').value,10)};save();audio();SFX.ok();renderHome()}}
function renderHome(){var p=data.profile||{name:'Player',age:8},i,stage='';for(i=1;i<=5;i++)stage+='<button data-st="'+i+'" class="'+(data.selectedStage===i?'on':'')+'" '+(i>data.unlockedStage&&i<5?'disabled':'')+'>'+i+'<br><small>'+(i===1?'기본':i===2?'탁음':i===3?'단어':i===4?'특수':'다음편')+'</small></button>';app.innerHTML='<main class="page"><div class="home-head"><div class="home-avatar">'+astronautSVG()+'</div><div class="home-title"><b>'+esc(p.name)+' · '+p.age+'세</b><small>현재 Stage '+data.selectedStage+' · 문제는 1개씩!</small></div><div class="level">LV.'+Math.max(1,Math.floor(data.score/900)+1)+'</div></div><section class="travel"><b>✦ 일본 여행 게이지</b><div class="bar"><i style="width:'+Math.min(100,Math.round(data.score/50))+'%"></i></div></section><div class="stage-strip">'+stage+'</div><div class="mission-grid"><button class="mission" id="defense"><div class="art">'+ufoSVG()+'</div><strong>우주선 격추</strong><small>문제 1개 · 보기 3→5개</small></button><button class="mission" id="quiz"><div class="art">'+ufoSVG()+'</div><strong>돌발 퀴즈</strong><small>시간 제한 보너스</small></button><button class="mission" id="type"><div class="art">'+astronautSVG()+'</div><strong>타임어택</strong><small>한글→히라가나</small></button><button class="mission" id="boss"><div class="art">'+ufoSVG()+'</div><strong>보스 웨이브</strong><small>연속 정답으로 격파</small></button></div>'+footer()+'</main>';each(qa('[data-st]'),function(b){b.onclick=function(){var st=parseInt(b.getAttribute('data-st'),10);if(st===5)return alert('단어편 앱에서 계속!');if(st<=data.unlockedStage){data.selectedStage=st;save();renderHome()}}});byId('defense').onclick=function(){audio();BGM.setSpeed(1);startGame('defense')};byId('quiz').onclick=function(){audio();BGM.setSpeed(1);startGame('quiz')};byId('type').onclick=function(){audio();BGM.setSpeed(2);startGame('type')};byId('boss').onclick=function(){audio();BGM.setSpeed(1);startGame('boss')}}
var G=null;function startGame(mode){G={mode:mode,stage:data.selectedStage,total:mode==='quiz'?8:(mode==='boss'?6:10),round:0,correct:0,lives:3,combo:0,best:0,recent:[],current:null,time:8,timer:null,confidence:null,boss:4,descentTimer:null,descentPct:0,locked:false};nextRound()}
function nextRound(){if(G.timer){clearInterval(G.timer);G.timer=null}if(G.descentTimer){clearInterval(G.descentTimer);G.descentTimer=null}if(G.lives<=0||G.round>=G.total){finish();return}G.current=choose(G.stage,G.recent);G.recent.push(G.current.id);if(G.recent.length>4)G.recent.shift();G.round++;if(G.mode==='defense')renderDefense();else if(G.mode==='quiz')renderQuiz();else if(G.mode==='type')renderType();else renderBoss()}

function startDescent(){if(!G||G.mode!=='defense')return;if(G.descentTimer)clearInterval(G.descentTimer);G.descentPct=0;G.locked=false;var t=byId('target'),astro=byId('astro');if(!t||!astro)return;G.descentTimer=setInterval(function(){if(!G||G.locked){clearInterval(G.descentTimer);G.descentTimer=null;return}G.descentPct+=0.72;var max=205;t.style.transform='translateX(-50%) translateY('+(max*G.descentPct/100)+'px)';if(G.descentPct>=100){clearInterval(G.descentTimer);G.descentTimer=null;G.locked=true;t.className+=' player-collision';astro.className+=' player-hit';G.lives--;G.combo=0;SFX.bad();setTimeout(function(){if(G.lives<=0)finish();else nextRound()},720)}},100)}

function bindGameCommon(){}
function answerDefense(btn){if(btn.disabled||G.locked)return;G.locked=true;if(G.descentTimer){clearInterval(G.descentTimer);G.descentTimer=null}var ok=btn.getAttribute('data-answer')===G.current.id,m=record(G.current,ok);each(qa('[data-answer]'),function(x){x.disabled=true;if(x.getAttribute('data-answer')===G.current.id)x.className+=' good'});if(!ok)btn.className+=' bad';shoot(ok);if(ok){G.correct++;G.combo++;G.best=Math.max(G.best,G.combo);data.score+=G.combo*15;save();SFX.shoot();setTimeout(SFX.boom,260)}else{G.lives--;G.combo=0;SFX.bad()}setTimeout(function(){if(m.streakWrong>=2){m.streakWrong=0;save();showGuide(G.current)}else nextRound()},850)}
function shoot(hit){var field=byId('gamefield'),astro=byId('astro'),target=byId('target');if(!field||!astro||!target)return;var fr=field.getBoundingClientRect(),ar=astro.getBoundingClientRect(),tr=target.getBoundingClientRect(),sx=ar.left-fr.left+ar.width*.72,sy=ar.top-fr.top+30,tx=tr.left-fr.left+tr.width*.5,ty=tr.top-fr.top+tr.height*.58,b=document.createElement('div');b.className='bullet';b.style.left=sx+'px';b.style.top=sy+'px';b.style.setProperty('--dx',(tx-sx)+'px');b.style.setProperty('--dy',(ty-sy)+'px');field.appendChild(b);setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);if(hit){target.className+=' dead';var e=document.createElement('div');e.className='explosion';e.style.left=tx+'px';e.style.top=ty+'px';field.appendChild(e);var h=document.createElement('div');h.className='hit';h.textContent='HIT! +'+(100+G.combo*15);field.appendChild(h);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);if(h.parentNode)h.parentNode.removeChild(h)},650)}},430)}
function renderQuiz(){BGM.setSpeed(1);G.time=8;var n=choiceCount(G.stage),opts=options(G.current,n),ans='',i;for(i=0;i<opts.length;i++)ans+='<button data-answer="'+esc(opts[i].id)+'">'+esc(opts[i].ko)+'</button>';app.innerHTML='<main class="page compact-page">'+space('<div id="target" class="target"><div class="ufo">'+ufoSVG()+'</div><div class="hanger"></div><div class="kana-orb">'+esc(G.current.jp)+'</div></div>')+'<section class="answers-panel"><div class="compact-mode-title">🚨 돌발 퀴즈 · <span class="timer-pill"><span id="timer">8</span>초</span></div><div class="answers c'+n+'">'+ans+'</div></section>'+footer()+'</main>';bindGameCommon();each(qa('[data-answer]'),function(b){b.onclick=function(){answerQuiz(b)}});G.timer=setInterval(function(){G.time--;if(byId('timer'))byId('timer').textContent=G.time;if(G.time<=0){clearInterval(G.timer);G.timer=null;answerQuiz(null)}},1000)}
function answerQuiz(btn){if(G.timer){clearInterval(G.timer);G.timer=null}var ok=btn&&btn.getAttribute('data-answer')===G.current.id,m=record(G.current,!!ok);if(ok){G.correct++;G.combo+=2;G.best=Math.max(G.best,G.combo);data.score+=200;save();SFX.ok();shoot(true)}else{G.lives--;G.combo=0;SFX.bad()}setTimeout(function(){if(m.streakWrong>=2){m.streakWrong=0;save();showGuide(G.current)}else nextRound()},800)}
function renderType(){BGM.setSpeed(2);G.time=6;var n=choiceCount(G.stage),opts=options(G.current,n),ans='',i;for(i=0;i<opts.length;i++)ans+='<button data-answer="'+esc(opts[i].id)+'">'+esc(opts[i].ko)+'</button>';app.innerHTML='<main class="page compact-page">'+space('<div class="qtitle" style="top:96px">⚡ 타임어택! <span>빠르게!</span></div><div class="qsub" style="top:130px">BGM 2배속 · 제한 시간 <span id="timer">6</span>초</div><div id="target" class="target"><div class="ufo">'+ufoSVG()+'</div><div class="hanger"></div><div class="kana-orb">'+esc(G.current.jp)+'</div></div>')+'<section class="answers-panel"><div class="compact-mode-title">⚡ TIME ATTACK · BGM ×2</div><div class="answers c'+n+'">'+ans+'</div></section>'+footer()+'</main>';bindGameCommon();each(qa('[data-answer]'),function(b){b.onclick=function(){answerType(b)}});G.timer=setInterval(function(){G.time--;if(byId('timer'))byId('timer').textContent=G.time;if(G.time<=0){clearInterval(G.timer);G.timer=null;answerType(null)}},1000)}
function answerType(btn){if(G.timer){clearInterval(G.timer);G.timer=null}var ok=!!btn&&btn.getAttribute('data-answer')===G.current.id,m=record(G.current,ok);if(ok){G.correct++;G.combo++;G.best=Math.max(G.best,G.combo);data.score+=140;save();SFX.ok()}else{G.lives--;G.combo=0;SFX.bad()}setTimeout(function(){if(m.streakWrong>=2){m.streakWrong=0;save();showGuide(G.current)}else nextRound()},650)}
function renderBoss(){BGM.setSpeed(1);var n=choiceCount(G.stage),opts=options(G.current,n),ans='',i;for(i=0;i<opts.length;i++)ans+='<button data-answer="'+esc(opts[i].id)+'">'+esc(opts[i].ko)+'</button>';var hp=Math.max(0,Math.round(G.boss/4*100));app.innerHTML='<main class="page compact-page">'+space('<div id="target" class="target"><div class="ufo" style="transform:scale(1.55);filter:hue-rotate(265deg) saturate(1.6)">'+ufoSVG()+'</div><div class="boss-hp-mini"><i style="width:'+hp+'%"></i></div><div class="kana-orb">'+esc(G.current.jp)+'</div></div>')+'<section class="answers-panel"><div class="compact-mode-title">👾 BOSS WAVE · HP '+G.boss+'/4</div><div class="answers c'+n+'">'+ans+'</div></section>'+footer()+'</main>';bindGameCommon();each(qa('[data-answer]'),function(b){b.onclick=function(){answerBoss(b)}})}
function answerBoss(btn){var ok=btn.getAttribute('data-answer')===G.current.id,m=record(G.current,ok);if(ok){G.correct++;G.boss--;data.score+=240;save();SFX.shoot();shoot(true);if(G.boss<=0){setTimeout(finish,900);return}}else{G.lives--;SFX.bad()}setTimeout(function(){if(m.streakWrong>=2){m.streakWrong=0;save();showGuide(G.current)}else nextRound()},800)}
function animateStrokeDissolve(host){var svg=host.querySelector('svg');if(!svg)return;var nodes=svg.querySelectorAll('path,line,polyline');if(!nodes.length){svg.style.opacity='0';setTimeout(function(){svg.style.transition='opacity .7s ease';svg.style.opacity='1'},60);return}for(var i=0;i<nodes.length;i++)nodes[i].style.opacity='0';var idx=0;function step(){if(idx>=nodes.length)return;nodes[idx].style.transition='opacity .45s ease';nodes[idx].style.opacity='1';idx++;setTimeout(step,520)}step()}
function showGuide(it){BGM.stop();var ov=document.createElement('div');ov.className='guide';ov.innerHTML='<div class="guide-card"><div class="brand-pill">2번 헷갈린 글자</div><h3>「'+esc(it.jp)+'」 이렇게 써!</h3><div id="stroke" class="stroke"><div style="font-size:110px;font-weight:1000;opacity:.18">'+esc(it.jp)+'</div></div><div class="stroke-step">획이 하나씩 디졸브로 나타나.</div><div class="enc">천천히 보면 금방 기억할 수 있어. 넌 할 수 있어! ✨</div><button id="againGuide" class="primary">다시 도전하기 ▶</button></div>';document.body.appendChild(ov);var host=byId('stroke'),ch=it.jp.charAt(0),url='https://raw.githubusercontent.com/zhengkyl/strokesvg/main/dist/hiragana/'+encodeURIComponent(ch)+'.svg';fetch(url).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(svg){host.innerHTML=svg;animateStrokeDissolve(host)}).catch(function(){host.innerHTML='<div style="font-size:110px;font-weight:1000;opacity:0;transition:opacity .8s ease">'+esc(ch)+'</div>';setTimeout(function(){if(host.firstChild)host.firstChild.style.opacity='1'},80)});byId('againGuide').onclick=function(){if(ov.parentNode)ov.parentNode.removeChild(ov);BGM.setSpeed(G&&G.mode==='type'?2:1);nextRound()}}
function finish(){BGM.stop();SFX.clear();var rate=Math.round(G.correct/Math.max(1,G.total)*100),rank=rate>=90?'S':rate>=75?'A':rate>=60?'B':'C';data.sessions.push({date:today(),mode:G.mode,stage:G.stage,correct:G.correct,total:G.total});save();app.innerHTML='<main class="page result"><div class="rank">'+rank+'</div><h1>'+(rank==='S'?'MISSION PERFECT!':'우주 방어 성공!')+'</h1><p>잘했어! 내일 다시 만나면 더 오래 기억해.</p><div class="result-grid"><div class="card"><b>'+G.correct+'</b><small>정답</small></div><div class="card"><b>×'+G.best+'</b><small>최고 콤보</small></div><div class="card"><b>'+rate+'%</b><small>정답률</small></div></div><button id="home" class="primary" style="margin-top:12px">오늘은 여기까지 ✓</button>'+footer()+'</main>';byId('home').onclick=renderHome}
function seedQA(){data=fresh();data.profile={name:'Sunny',age:8};data.unlockedStage=4;data.selectedStage=1;save()}function qaMode(){var m=location.search.match(/[?&]qa=([^&]+)/);return m?decodeURIComponent(m[1]):''}function boot(){var m=qaMode();if(m){seedQA();if(m==='welcome'){data=fresh();renderWelcome();return}if(m==='home'){renderHome();return}if(m==='game'){G={mode:'defense',stage:1,total:10,round:6,correct:5,lives:3,combo:12,best:12,recent:[],current:ITEMS.filter(function(x){return x.jp==='た'})[0],confidence:null,descentTimer:null,descentPct:0,locked:false};renderDefense();return}if(m==='quiz'){G={mode:'quiz',stage:1,total:8,round:3,correct:2,lives:3,combo:3,best:3,recent:[],current:ITEMS.filter(function(x){return x.jp==='ま'})[0],time:8,timer:null,descentTimer:null};renderQuiz();return}if(m==='type'){G={mode:'type',stage:2,total:10,round:4,correct:3,lives:3,combo:4,best:4,recent:[],current:ITEMS.filter(function(x){return x.jp==='し'})[0],descentTimer:null};renderType();return}if(m==='boss'){G={mode:'boss',stage:2,total:6,round:4,correct:3,lives:3,combo:5,best:5,recent:[],current:ITEMS.filter(function(x){return x.jp==='ほ'})[0],boss:3,descentTimer:null};renderBoss();return}if(m==='guide'){renderHome();showGuide(ITEMS.filter(function(x){return x.jp==='た'})[0]);return}}if(data.profile)renderHome();else renderWelcome()}window.onerror=function(msg,url,line,col,err){app.innerHTML='<main class="page"><section class="card"><h2>앱 오류</h2><pre style="white-space:pre-wrap">'+esc(err&&err.stack?err.stack:String(msg)+' @ '+line+':'+col)+'</pre></section></main>'};boot();
})();
</script>
