function esc(v){return text(v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

function shuffle(a){var b=cloneArray(a),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t}return b}

 {g:'ま행',jp:['ま','み','む','め','も'],ko:['마','미','무','메','모']},
 {g:'や행',jp:['や','ゆ','よ'],ko:['야','유','요']},
 {g:'ら행',jp:['ら','り','る','れ','ろ'],ko:['라','리','루','레','로']},

 {g:'ざ행',jp:['ざ','じ','ず','ぜ','ぞ'],ko:['자','지','즈','제','조']},

var YOON=[['きゃ','캬'],['きゅ','큐'],['きょ','쿄'],['しゃ','샤'],['しゅ','슈'],['しょ','쇼'],['ちゃ','챠'],['ちゅ','츄'],['ちょ','쵸'],['にゃ','냐'],['にゅ','뉴'],['にょ','뇨'],['ひゃ','햐'],['ひゅ','휴'],['ひょ','효'],['みゃ','먀'],['みゅ','뮤'],['みょ','묘'],['りゃ','랴'],['りゅ','류'],['りょ','료'],['ぎゃ','갸'],['ぎゅ','규'],['ぎょ','교'],['じゃ','쟈'],['じゅ','쥬'],['じょ','죠'],['びゃ','뱌'],['びゅ','뷰'],['びょ','뵤'],['ぴゃ','퍄'],['ぴゅ','퓨'],['ぴょ','표']];
var WORDS=[['あめ','아메','비','🌧️'],['いぬ','이누','개','🐶'],['ねこ','네코','고양이','🐱'],['うみ','우미','바다','🌊'],['やま','야마','산','⛰️'],['そら','소라','하늘','☁️'],['はな','하나','꽃','🌷'],['ほし','호시','별','⭐'],['つき','츠키','달','🌙'],['いえ','이에','집','🏠'],['みず','미즈','물','💧'],['さかな','사카나','물고기','🐟'],['とり','토리','새','🐦'],['くるま','쿠루마','자동차','🚗'],['すし','스시','초밥','🍣'],['かさ','카사','우산','☂️'],['あさ','아사','아침','🌅']];
var SPECIAL=[['きって','킷테','우표','🏷️'],['がっこう','각코우','학교','🏫'],['ざっし','잣시','잡지','📖'],['ほん','혼','책','📚'],['ぱん','팡','빵','🍞'],['みかん','미캉','귤','🍊'],['にほん','니혼','일본','🇯🇵'],['でんしゃ','덴샤','전철','🚃'],['りんご','링고','사과','🍎']];
var ITEMS=[];
function buildItems(){var i,j;for(i=0;i<BASIC.length;i++){for(j=0;j<BASIC[i].jp.length;j++){ITEMS.push({id:'b-'+BASIC[i].jp[j],jp:BASIC[i].jp[j],ko:BASIC[i].ko[j],stage:1,group:i,kind:'kana'})}}for(i=0;i<DAK.length;i++){for(j=0;j<DAK[i].jp.length;j++){ITEMS.push({id:'d-'+DAK[i].jp[j],jp:DAK[i].jp[j],ko:DAK[i].ko[j],stage:2,group:i,kind:'kana'})}}for(i=0;i<YOON.length;i++){ITEMS.push({id:'y-'+YOON[i][0],jp:YOON[i][0],ko:YOON[i][1],stage:2,group:5+Math.floor(i/9),kind:'combo'})}for(i=0;i<WORDS.length;i++){ITEMS.push({id:'w-'+WORDS[i][0],jp:WORDS[i][0],ko:WORDS[i][1],meaning:WORDS[i][2],emoji:WORDS[i][3],stage:3,group:0,kind:'word'})}for(i=0;i<SPECIAL.length;i++){ITEMS.push({id:'s-'+SPECIAL[i][0],jp:SPECIAL[i][0],ko:SPECIAL[i][1],meaning:SPECIAL[i][2],emoji:SPECIAL[i][3],stage:4,group:0,kind:'word'})}}
buildItems();
function defaultM(){return {seen:0,correct:0,wrong:0,level:0,last:0,due:0,mismatch:0,exposures:0}}
function fresh(){return {version:VERSION,profile:null,mastery:{},sessions:[],today:{date:today(),answered:0,correct:0,newIds:[],mastered:[]},selectedStage:1,unlockedStage:1,sound:true,bgm:true,bgmTrack:0,lastRoute:'home'}}
function safeLoad(){var d=fresh(),raw,parsed;try{raw=localStorage.getItem(STORAGE);if(!raw)return d;parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object'){if(parsed.profile&&typeof parsed.profile==='object')d.profile=parsed.profile;if(parsed.mastery&&typeof parsed.mastery==='object')d.mastery=parsed.mastery;if(parsed.sessions&&parsed.sessions.length)d.sessions=parsed.sessions;if(parsed.today&&parsed.today.date===today())d.today=parsed.today;if(parsed.selectedStage)d.selectedStage=parsed.selectedStage;if(parsed.unlockedStage)d.unlockedStage=parsed.unlockedStage;if(parsed.sound===false)d.sound=false;if(parsed.bgm===false)d.bgm=false;if(typeof parsed.bgmTrack==='number')d.bgmTrack=parsed.bgmTrack}}catch(e){try{localStorage.removeItem(STORAGE)}catch(ignore){}}return d}
var data=safeLoad();
function save(){try{data.version=VERSION;localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){}}
function m(id){var src=data.mastery[id],o=defaultM(),k;if(src&&typeof src==='object'){for(k in src){if(Object.prototype.hasOwnProperty.call(src,k))o[k]=src[k]}}return o}
function stageItems(stage){var a=[],i;for(i=0;i<ITEMS.length;i++){if(ITEMS[i].stage===stage)a.push(ITEMS[i])}return a}
function mastered(stage){var a=stageItems(stage),n=0,i;for(i=0;i<a.length;i++){if(m(a[i].id).level>=3)n++}return n}
function currentGroup(stage){var groups,max,i,a,item,good,total;if(stage===1)groups=10;else if(stage===2)groups=9;else return 0;for(i=0;i<groups;i++){a=[];for(var z=0;z<ITEMS.length;z++){item=ITEMS[z];if(item.stage===stage&&item.group===i)a.push(item)}if(!a.length)continue;good=0;total=a.length;for(var j=0;j<a.length;j++){if(m(a[j].id).level>=2)good++}if(good<Math.max(1,Math.ceil(total*.7)))return i}return groups-1}
function activePool(stage){var all=stageItems(stage),out=[],g,i;if(stage===1||stage===2){g=currentGroup(stage);for(i=0;i<all.length;i++){if(all[i].group<=g)out.push(all[i])}return out}return all}
function unlock(){var s1=stageItems(1).length,s2=stageItems(2).length,s3=stageItems(3).length;if(mastered(1)>=Math.ceil(s1*.75))data.unlockedStage=Math.max(data.unlockedStage,2);if(mastered(2)>=Math.ceil(s2*.7))data.unlockedStage=Math.max(data.unlockedStage,3);if(mastered(3)>=Math.ceil(s3*.7))data.unlockedStage=Math.max(data.unlockedStage,4);if(data.selectedStage>data.unlockedStage)data.selectedStage=data.unlockedStage}
function weight(item){var mm=m(item.id),w=2;if(mm.seen===0)w+=7;if(mm.seen>0&&mm.due<=now())w+=6;w+=Math.min(8,mm.wrong*2)+Math.min(6,mm.mismatch*3);if(item.kind==='word'&&mm.seen>0&&mm.exposures<6)w+=(6-mm.exposures)*2;if(mm.level>=3)w-=1;return Math.max(1,w)}
function choose(stage,exclude){var pool=activePool(stage),filtered=[],weighted=[],i,j;if(exclude){for(i=0;i<pool.length;i++){if(!contains(exclude,pool[i].id))filtered.push(pool[i])}}if(filtered.length)pool=filtered;for(i=0;i<pool.length;i++){for(j=0;j<weight(pool[i]);j++)weighted.push(pool[i])}if(!weighted.length)return null;return weighted[Math.floor(Math.random()*weighted.length)]}
function choiceCount(stage){if(stage===1){var g=currentGroup(1);return g<2?3:(g<6?4:5)}return stage===2?5:6}
function makeChoices(qn,stage,reverse){var answer=reverse?qn.jp:qn.ko,need=choiceCount(stage)-1,all=shuffle(stageItems(stage)),vals=[],v,i,j,dup;for(i=0;i<all.length&&vals.length<need;i++){if(all[i].id===qn.id)continue;v=reverse?all[i].jp:all[i].ko;if(v===answer)continue;dup=false;for(j=0;j<vals.length;j++){if(vals[j]===v)dup=true}if(!dup)vals.push(v)}vals.push(answer);return shuffle(vals)}
function sessionSize(stage){if(stage===1){var g=currentGroup(1);return g<2?10:(g<6?15:20)}return stage===3?18:20}
function rainSeconds(stage){if(stage===1){var g=currentGroup(1);return g<2?11:(g<6?9:8)}return stage===3?10:8}
function record(qn,ok,confidence){var mm=m(qn.id),wasNew=mm.seen===0,due=mm.seen===0||mm.due<=now(),level=mm.level;if(ok&&due)level=Math.min(3,level+1);if(!ok)level=Math.max(0,level-1);var intervals=[180000,600000,21600000,86400000];mm.seen++;mm.exposures++;if(ok)mm.correct++;else mm.wrong++;if(confidence==='sure'&&!ok)mm.mismatch++;mm.level=level;mm.last=now();mm.due=ok?now()+intervals[level]:now()+180000;data.mastery[qn.id]=mm;data.today.answered++;if(ok)data.today.correct++;if(wasNew&&!contains(data.today.newIds,qn.id))data.today.newIds.push(qn.id);if(level===3&&!contains(data.today.mastered,qn.id))data.today.mastered.push(qn.id);unlock();save()}

var audioCtx=null;
function ctx(){try{if(!audioCtx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioCtx=new C()}if(audioCtx.state==='suspended'&&audioCtx.resume)audioCtx.resume();return audioCtx}catch(e){return null}}
function beep(freq,dur,wave,gain,delay){if(!data.sound)return;var c=ctx();if(!c)return;var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(delay||0);o.type=wave||'square';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(gain||.02,t);g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.06));o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(dur||.06)+.03)}
var SFX={tap:function(){beep(520,.025,'square',.012)},ok:function(){beep(660,.05,'square',.026);beep(880,.08,'triangle',.027,.05);beep(1175,.12,'sine',.022,.12)},bad:function(){beep(220,.08,'triangle',.018);beep(175,.11,'sine',.015,.07)},catcher:function(){beep(460,.025,'square',.017);beep(720,.04,'square',.019,.025)},jump:function(){beep(330,.035,'triangle',.017);beep(550,.05,'square',.019,.04)},win:function(){var a=[523,659,784,988,1175];for(var i=0;i<a.length;i++)beep(a[i],.13,i<3?'square':'triangle',.026,i*.09);beep(1568,.26,'sine',.018,.48)}};
var NAMES=['Quiet Harbor','Paper Compass','Little Trade Wind','Morning Port','Blue Map','Tea on Deck','Cloud Route','Pocket Sextant','Soft Lantern','Sailor Nap','Mossy Pier','Ivory Horizon','Tiny Caravan','Old Post Road','Calm Current','Moonlit Market','Pebble Coast','Wooden Wheel','Distant Bell','Green Cape','Mapmaker Room','Small Adventure','Amber Sea','Rainy Quay','Feather Flag','Slow Meridian','Homebound Sail','Gentle Bazaar','Secret Inlet','Sunny Logbook','Quiet Archipelago','Windmill Bay','Mint Horizon','Daybreak Dock','Little North Star','Soft Expedition','Canvas Sail','Evening Ferry','Warm Lighthouse','Pocket Ocean','Sleepy Harbor','Sea Glass','Tiny Frontier','Calm Monsoon','Map and Cocoa','Island Letter','Soft Helm','Dawn Anchorage','Old Compass','Home Port'];
var SCALES=[[0,2,4,7,9],[0,2,3,7,9],[0,2,5,7,9],[0,3,5,7,10],[0,2,4,6,9]];var MOTIFS=[[0,1,2,1,3,2,1,0],[0,2,1,3,2,4,3,1],[0,1,3,2,1,2,4,2],[0,3,2,1,2,3,1,0],[0,2,4,3,2,1,2,0],[0,1,2,4,3,2,1,3],[0,3,1,2,4,2,1,0],[0,2,3,1,4,3,2,1],[0,1,4,2,3,1,2,0],[0,3,4,2,1,3,2,0]];
function hz(n){return 440*Math.pow(2,(n-69)/12)}
var BGM={timer:null,step:0,title:function(){return NAMES[data.bgmTrack%50]},stop:function(){if(this.timer){clearInterval(this.timer);this.timer=null}},start:function(){var self=this;if(!data.bgm||!data.sound)return;ctx();this.stop();this.step=0;this.timer=setInterval(function(){self.tick()},360)},tick:function(){if(!data.bgm||!data.sound)return;var i=data.bgmTrack%50,root=[45,48,50,52,53,55,57,43,47,49][i%10],scale=SCALES[Math.floor(i/10)%5],mot=MOTIFS[i%10],s=this.step%8,degree=mot[s]%scale.length,n=root+scale[degree]+(s===6&&i%4===0?12:0);beep(hz(n),.12,i%3===0?'triangle':'square',.006);if(s%2===0)beep(hz(root-12+scale[(s/2)%scale.length]),.16,'triangle',.004,.02);this.step++},toggle:function(){data.bgm=!data.bgm;save();if(data.bgm)this.start();else this.stop()},next:function(){data.bgmTrack=(data.bgmTrack+1)%50;save();this.start()}};

function top(title,back){return '<div class="top"><button class="iconbtn" data-go="'+(back||'home')+'">‹</button><div class="title">'+esc(title)+'</div><button class="iconbtn" data-go="settings">⚙️</button></div>'}
function bgmbar(){return '<div class="bgmbar"><button id="bgmToggle">'+(data.bgm?'● BGM':'○ BGM')+'</button><button id="bgmNext">↻</button></div>'}
function bindCommon(){each(qa('[data-go]'),function(b){b.onclick=function(){SFX.tap();BGM.stop();route(b.getAttribute('data-go'))}});var t=byId('bgmToggle'),n=byId('bgmNext');if(t)t.onclick=function(){SFX.tap();BGM.toggle();t.innerHTML=data.bgm?'● BGM':'○ BGM'};if(n)n.onclick=function(){SFX.tap();BGM.next()}}
function route(name){try{if(name==='home')renderHome();else if(name==='map')renderMap();else if(name==='rain'||name==='jump')startGame(name);else if(name==='settings')renderSettings();else if(name==='parent')renderParent();else renderHome()}catch(e){showError('화면 이동 오류',e)}}
function showError(title,e){BGM.stop();app.innerHTML='<main class="page"><div class="logo">HIRAGANADA ver'+VERSION+'</div><div class="hero"><img src="icon-180.png"><h1>'+esc(title)+'</h1></div><div class="error">'+esc((e&&e.message)?e.message:String(e))+'</div><button class="primary" id="recover" style="margin-top:14px">안전하게 다시 시작</button>'+CREDIT()+'</main>';var r=byId('recover');if(r)r.onclick=function(){try{data=fresh();save()}catch(ignore){}renderWelcome()}}
function renderWelcome(){BGM.stop();var frogs=['🐸','🐱','🐬','🦊'];app.innerHTML='<main class="page"><div class="hero"><div class="logo">HIRAGANADA ver'+VERSION+'</div><div><img src="icon-180.png" alt="Hiraganada"></div><h1>히라가나다라마바사</h1><p>게임처럼 놀면서 하나씩 제대로 외우자!</p></div><section class="card"><label><b>이름을 알려줘</b></label><input id="name" class="field" maxlength="12" placeholder="예: Sunny"><label style="display:block;margin-top:13px"><b>내 캐릭터</b></label><div class="frogpick">';for(var i=0;i<frogs.length;i++)app.innerHTML+='<button class="'+(i===0?'on':'')+'" data-frog="'+frogs[i]+'">'+frogs[i]+'</button>';app.innerHTML+='</div></section><button id="start" class="primary">모험 시작하기 ▶</button>'+CREDIT()+'</main>';var selected='🐸';each(qa('[data-frog]'),function(b){b.onclick=function(){SFX.tap();selected=b.getAttribute('data-frog');each(qa('[data-frog]'),function(x){x.className=''});b.className='on'}});byId('start').onclick=function(){var name=byId('name').value.replace(/^\s+|\s+$/g,'');if(!name)name='Sunny';data.profile={name:name,frog:selected};save();SFX.ok();renderHome()}}
function renderHome(){unlock();var p=data.profile||{name:'Sunny',frog:'🐸'},done=mastered(1),total=stageItems(1).length,pct=Math.round(done/Math.max(1,total)*100),rate=data.today.answered?Math.round(data.today.correct/data.today.answered*100):0,tr=[];for(var i=0;i<ITEMS.length;i++){var mm=m(ITEMS[i].id);if(mm.seen&&mm.wrong)tr.push({item:ITEMS[i],score:mm.wrong+mm.mismatch*2})}tr.sort(function(a,b){return b.score-a.score});app.innerHTML='<main class="page"><div class="top"><div></div><div class="title">🐸 '+esc(p.name)+'</div><button class="iconbtn" data-go="settings">⚙️</button></div><section class="travel"><div class="route">🇰🇷<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>🇯🇵</div><b>일본 여행까지 한 걸음!</b><div style="font-size:11px;margin-top:4px">히라가나를 다 외우면 아빠랑 일본에서 직접 읽어보자 ✈️</div></section><div class="stats"><div><small>오늘</small><b>'+data.today.answered+'</b></div><div><small>정답률</small><b>'+(data.today.answered?rate+'%':'—')+'</b></div><div><small>완전 기억</small><b>'+done+'</b></div></div><button class="primary" data-go="map">▶ 이어서 공부하기</button><div class="games" style="margin-top:11px"><button class="game rain" data-go="rain"><span class="big">🌧️</span>히라가나비오나<small>떨어지는 글자를 낼름!</small></button><button class="game jump" data-go="jump"><span class="big">🌿</span>개구리점프<small>소리를 보고 폴짝!</small></button></div>'+(tr.length?'<section class="card"><b>🐸 다시 만나고 싶은 글자</b><div style="font-size:28px;margin-top:7px">'+esc(tr.slice(0,5).map(function(x){return x.item.jp}).join('  '))+'</div></section>':'')+'<div class="nav"><button data-go="map">🗺️<small>학습지도</small></button><button data-go="parent">📊<small>아빠 화면</small></button><button data-go="settings">⚙️<small>설정</small></button></div>'+CREDIT()+'</main>';bindCommon()}
function renderMap(){var labels=[['🌱','기본 히라가나','あいうえお부터 한 줄씩'],['🌿','탁음 · 조합음','が・ぱ・りゃ도 만나기'],['🌸','히라가나 단어','あめ = 아메 = 비'],['🏯','っ · ん 단어','がっこう・ほん 읽기']];app.innerHTML='<main class="page">'+top('히라가나 모험지도','home')+'<div class="card" style="text-align:center"><b>하나씩 제대로 외우자.</b><div style="font-size:11px;margin-top:5px">⭐ 3개 = 시간 간격을 두고 여러 번 기억한 글자</div></div><div class="maplist">';for(var i=0;i<labels.length;i++){var st=i+1,arr=stageItems(st),d=mastered(st),pct=Math.round(d/Math.max(1,arr.length)*100),locked=st>data.unlockedStage;app.innerHTML+='<button class="stage '+(locked?'lock':'')+'" data-stage="'+st+'" '+(locked?'disabled':'')+'><span class="em">'+(locked?'🔒':labels[i][0])+'</span><span><small>STAGE '+st+'</small><br><b>'+labels[i][1]+'</b><div style="font-size:11px">'+labels[i][2]+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></span></button>'}app.innerHTML+='</div><div class="sticky"><button class="primary" data-go="rain">🌧️ 비오나로 공부</button><button class="secondary" data-go="jump">🌿 점프로 복습</button></div>'+CREDIT()+'</main>';bindCommon();each(qa('[data-stage]'),function(b){b.onclick=function(){var st=parseInt(b.getAttribute('data-stage'),10);if(st<=data.unlockedStage){data.selectedStage=st;save();SFX.tap();renderMap()}}})}
function startGame(mode){var stage=Math.min(data.selectedStage||1,data.unlockedStage),total=sessionSize(stage),idx=0,correct=0,confidence=null,history=[],qn=choose(stage,[]),timer=null,answered=false,reverse=mode==='jump';if(!qn){showError('문제 준비 오류',new Error('학습 항목이 없어.'));return}function draw(){if(timer)clearInterval(timer);answered=false;confidence=null;var cs=makeChoices(qn,stage,reverse),sec=rainSeconds(stage),cls=cs.length===4?'two':'';app.innerHTML='<main class="page gameplay">'+top(mode==='rain'?'히라가나비오나':'개구리점프','home')+bgmbar()+'<div class="progress"><i style="width:'+Math.round(idx/total*100)+'%"></i></div><div class="meta"><span>이거 자신 있어?</span><button data-confidence="sure">😎 알아!</button><button data-confidence="unsure">🤔 헷갈려</button></div>'+(mode==='rain'?'<section id="scene" class="scene rainScene"><div class="cloud">☁️　☁️</div><div id="drop" class="drop">'+esc(qn.jp)+'</div><div class="tongue"></div><div class="frog">🐸</div></section>':'<section id="scene" class="scene jumpScene"><div class="bubble">'+esc(qn.ko)+'!</div><div class="leaves">🌿　🌿　🌿</div><div class="frog">🐸</div></section>')+'<div class="answers '+cls+'">';for(var ci=0;ci<cs.length;ci++)app.innerHTML+='<button data-answer="'+esc(cs[ci])+'">'+esc(cs[ci])+'</button>';app.innerHTML+='</div><div id="feedback" class="feedback">'+(idx+1)+'/'+total+' · 정답을 골라줘!</div>'+CREDIT()+'</main>';bindCommon();each(qa('[data-confidence]'),function(b){b.onclick=function(){SFX.tap();confidence=b.getAttribute('data-confidence');each(qa('[data-confidence]'),function(x){x.className=''});b.className='on'}});each(qa('[data-answer]'),function(b){b.onclick=function(){answer(b.getAttribute('data-answer'),b)}});if(mode==='rain'){var elapsed=0;var drop=byId('drop');timer=setInterval(function(){elapsed++;if(drop)drop.style.top=(10+elapsed*(58/sec))+'%';if(elapsed>=sec){clearInterval(timer);answer('__timeout__',null)}},1000)}}
function answer(value,button){if(answered)return;answered=true;if(timer)clearInterval(timer);var right=reverse?qn.jp:qn.ko,ok=value===right;record(qn,ok,confidence);if(ok)correct++;each(qa('[data-answer]'),function(b){b.disabled=true;if(b.getAttribute('data-answer')===right)b.className+=' good'});if(button&&!ok)button.className+=' bad';var scene=byId('scene'),fb=byId('feedback');if(ok){if(scene)scene.className+=' '+(mode==='rain'?'catch':'jumpok');if(mode==='rain')SFX.catcher();else SFX.jump();setTimeout(SFX.ok,170);if(fb)fb.innerHTML='정답! 잘했어 ✨'}else{SFX.bad();if(fb)fb.innerHTML='앗! '+esc(qn.jp)+' = '+esc(qn.ko)+' · 조금 뒤 다시 만나자 🐸'}if(qn.kind==='word')setTimeout(function(){showWord(qn)},ok?420:220);setTimeout(next,qn.kind==='word'?2400:1000)}
function showWord(x){var div=document.createElement('div');div.className='wordoverlay';div.innerHTML='<div class="wordcard"><div class="emoji">'+esc(x.emoji)+'</div><div class="jp">'+esc(x.jp)+'</div><div class="ko">'+esc(x.ko)+'</div><div class="meaning">'+esc(x.meaning)+'</div><small>✨ 이 단어는 다시 불현듯 만나게 될 거야!</small></div>';document.body.appendChild(div)}
function next(){var ov=q('.wordoverlay');if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);idx++;if(idx>=total){data.sessions.push({date:today(),answered:total,correct:correct,stage:stage,mode:mode,finishedAt:now()});save();BGM.stop();SFX.win();renderResult(total,correct);return}history.push(qn.id);if(history.length>4)history.shift();qn=choose(stage,history);draw()}
BGM.start();draw()}
function renderResult(total,correct){var rate=Math.round(correct/Math.max(1,total)*100),frog=(data.profile&&data.profile.frog)?data.profile.frog:'🐸';app.innerHTML='<main class="page result"><div class="frogBig">'+frog+'</div><small>오늘의 모험 완료 · ver'+VERSION+'</small><h1>'+(rate>=90?'기억력이 반짝반짝!':(rate>=70?'점점 더 잘 기억하고 있어!':'헷갈린 글자는 다시 만나면 돼!'))+'</h1><div class="resultgrid"><div><b>'+correct+'</b><small>정답</small></div><div><b>'+data.today.newIds.length+'</b><small>새로 만남</small></div><div><b>'+data.today.mastered.length+'</b><small>완전 기억</small></div></div><section class="card"><b>🧠 오늘 내 기억 점검</b><p>“알아!”라고 했는데 틀린 글자는 다음 복습에서 더 자주 만나게 돼.</p></section><button class="primary" data-go="home">오늘은 여기까지! ✓</button><button class="secondary" data-go="map" style="margin-top:8px">조금 더 할래</button>'+CREDIT()+'</main>';bindCommon()}
function renderParent(){var seen=0,master=0,wrong=[],i,mm,total=0;for(i=0;i<ITEMS.length;i++){mm=m(ITEMS[i].id);if(mm.seen){seen++;if(mm.level>=3)master++;if(mm.wrong)wrong.push({it:ITEMS[i],score:mm.wrong+mm.mismatch*2})}}for(i=0;i<data.sessions.length;i++)total+=data.sessions[i].answered||0;wrong.sort(function(a,b){return b.score-a.score});app.innerHTML='<main class="page settings">'+top('아빠 학습 리포트','home')+'<section class="card"><h3>📊 '+esc(data.profile?data.profile.name:'아이')+'의 히라가나</h3><div class="stats"><div><small>학습 항목</small><b>'+seen+'</b></div><div><small>완전 기억</small><b>'+master+'</b></div><div><small>누적 문제</small><b>'+total+'</b></div></div></section><section class="card"><h3>다시 볼 항목</h3><div style="font-size:26px">'+(wrong.length?esc(wrong.slice(0,8).map(function(x){return x.it.jp}).join('  ')):'아직 없어 👍')+'</div></section><section class="card"><h3>메타인지 규칙</h3><ul><li>새 글자 + 복습 예정 + 오답을 섞어서 출제</li><li>직전 4문제는 피해서 답 외우기를 방지</li><li>“알아!”라고 했는데 틀리면 복습 가중치 상승</li><li>시간 간격을 둔 정답에서 숙련도 상승</li></ul></section>'+CREDIT()+'</main>';bindCommon()}
function renderSettings(){app.innerHTML='<main class="page settings">'+top('부모 설정','home')+'<section class="card"><div class="minirow"><div><h3>🎮 게임 사운드</h3><div style="font-size:11px">효과음 + 오리지널 레트로 BGM 50곡</div></div><button id="sound" class="secondary" style="width:auto;padding:0 13px">'+(data.sound?'🔊 켜짐':'🔇 꺼짐')+'</button></div><button id="test" class="secondary" style="margin-top:10px">뿅뿅 소리 테스트</button><div style="font-size:10px;margin-top:7px">현재 BGM: '+esc(BGM.title())+' · '+(data.bgmTrack+1)+'/50</div></section><section class="card"><h3>✈️ 장기 목표</h3><p>히라가나를 다 외우면 아빠랑 일본 여행 먼저 가기!</p></section><section class="card"><h3>데이터</h3><p style="font-size:11px">학습 기록은 현재 이 iPhone의 Safari 저장소에만 저장돼.</p><button id="reset" class="secondary">학습 기록 초기화</button></section>'+CREDIT()+'</main>';bindCommon();byId('sound').onclick=function(){data.sound=!data.sound;save();if(data.sound)SFX.ok();renderSettings()};byId('test').onclick=function(){data.sound=true;save();SFX.tap();setTimeout(SFX.ok,130)};byId('reset').onclick=function(){if(confirm('학습 기록을 전부 지울까?')){try{localStorage.removeItem(STORAGE)}catch(e){}data=fresh();renderWelcome()}}}

function selfTest(){var result=[];function t(name,ok){result.push((ok?'PASS ':'FAIL ')+name)}t('Stage1 excludes を/ん',stageItems(1).every(function(x){return x.jp!=='を'&&x.jp!=='ん'}));t('Stage3 excludes っ/ん',stageItems(3).every(function(x){return x.jp.indexOf('っ')<0&&x.jp.indexOf('ん')<0}));t('Stage4 has っ or ん',stageItems(4).every(function(x){return x.jp.indexOf('っ')>=0||x.jp.indexOf('ん')>=0}));t('50 BGM names',NAMES.length===50);t('Initial active pool is あ row',activePool(1).length===5);t('Initial choices 3',choiceCount(1)===3);return result}
function boot(){try{unlock();window.__HIRAGANADA_TESTS=selfTest();if(data.profile)renderHome();else renderWelcome();window.__HIRAGANADA_READY=true}catch(e){window.__HIRAGANADA_READY=false;showError('앱 시작 오류',e)}}
window.onerror=function(msg,url,line,col,err){if(!window.__HIRAGANADA_READY){showError('앱 시작 오류',err||new Error(String(msg)+' @ '+line+':'+col))}return false};
boot();
})();
