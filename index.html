<script>

function shoot(hit){var field=byId('gamefield'),astro=byId('astro'),target=byId('target');if(!field||!astro||!target)return;var fr=field.getBoundingClientRect(),ar=astro.getBoundingClientRect(),tr=target.getBoundingClientRect(),sx=ar.left-fr.left+ar.width*.72,sy=ar.top-fr.top+30,tx=tr.left-fr.left+tr.width*.5,ty=tr.top-fr.top+tr.height*.58,b=document.createElement('div');b.className='bullet';b.style.left=sx+'px';b.style.top=sy+'px';b.style.setProperty('--dx',(tx-sx)+'px');b.style.setProperty('--dy',(ty-sy)+'px');field.appendChild(b);setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);if(hit){target.className+=' dead';var e=document.createElement('div');e.className='explosion';e.style.left=tx+'px';e.style.top=ty+'px';field.appendChild(e);var h=document.createElement('div');h.className='hit';h.textContent='HIT! +'+(100+G.combo*15);field.appendChild(h);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);if(h.parentNode)h.parentNode.removeChild(h)},650)}},430)}
function renderQuiz(){G.time=8;var n=choiceCount(G.stage),opts=options(G.current,n),ans='',i;for(i=0;i<opts.length;i++)ans+='<button data-answer="'+esc(opts[i].id)+'">'+esc(opts[i].ko)+'</button>';app.innerHTML='<main class="page">'+space('<div id="target" class="target"><div class="ufo">'+ufoSVG()+'</div><div class="hanger"></div><div class="kana-orb">'+esc(G.current.jp)+'</div></div>')+'<section class="answers-panel"><div style="text-align:center;font-weight:1000;color:#ffd65b;margin:8px">🚨 돌발 퀴즈 · <span id="timer">8</span>초</div><div class="answers c'+n+'">'+ans+'</div></section>'+footer()+'</main>';bindGameCommon();each(qa('[data-answer]'),function(b){b.onclick=function(){answerQuiz(b)}});G.timer=setInterval(function(){G.time--;if(byId('timer'))byId('timer').textContent=G.time;if(G.time<=0){clearInterval(G.timer);G.timer=null;answerQuiz(null)}},1000)}
function answerQuiz(btn){if(G.timer){clearInterval(G.timer);G.timer=null}var ok=btn&&btn.getAttribute('data-answer')===G.current.id,m=record(G.current,!!ok);if(ok){G.correct++;G.combo+=2;G.best=Math.max(G.best,G.combo);data.score+=200;save();SFX.ok();shoot(true)}else{G.lives--;G.combo=0;SFX.bad()}setTimeout(function(){if(m.streakWrong>=3){m.streakWrong=0;save();showGuide(G.current)}else nextRound()},800)}
function renderType(){var n=choiceCount(G.stage),opts=options(G.current,n),ans='',i;for(i=0;i<opts.length;i++)ans+='<button data-answer="'+esc(opts[i].id)+'">'+esc(opts[i].jp)+'</button>';app.innerHTML='<main class="page">'+space('<div class="qtitle" style="top:240px">목표 읽기: <span>'+esc(G.current.ko)+'</span></div>')+'<section class="answers-panel"><div class="answers c'+n+'">'+ans+'</div></section>'+footer()+'</main>';bindGameCommon();each(qa('[data-answer]'),function(b){b.onclick=function(){answerType(b)}})}
function answerType(btn){var ok=btn.getAttribute('data-answer')===G.current.id,m=record(G.current,ok);if(ok){G.correct++;G.combo++;G.best=Math.max(G.best,G.combo);data.score+=140;save();SFX.ok()}else{G.lives--;G.combo=0;SFX.bad()}setTimeout(function(){if(m.streakWrong>=3){m.streakWrong=0;save();showGuide(G.current)}else nextRound()},650)}
function renderBoss(){var n=choiceCount(G.stage),opts=options(G.current,n),ans='',i;for(i=0;i<opts.length;i++)ans+='<button data-answer="'+esc(opts[i].id)+'">'+esc(opts[i].ko)+'</button>';app.innerHTML='<main class="page">'+space('<div id="target" class="target"><div class="ufo">'+ufoSVG()+'</div><div style="margin-top:6px;font-weight:1000">BOSS HP '+G.boss+'/4</div><div class="kana-orb">'+esc(G.current.jp)+'</div></div>')+'<section class="answers-panel"><div class="answers c'+n+'">'+ans+'</div></section>'+footer()+'</main>';bindGameCommon();each(qa('[data-answer]'),function(b){b.onclick=function(){answerBoss(b)}})}
function answerBoss(btn){var ok=btn.getAttribute('data-answer')===G.current.id,m=record(G.current,ok);if(ok){G.correct++;G.boss--;data.score+=240;save();SFX.shoot();shoot(true);if(G.boss<=0){setTimeout(finish,900);return}}else{G.lives--;SFX.bad()}setTimeout(function(){if(m.streakWrong>=3){m.streakWrong=0;save();showGuide(G.current)}else nextRound()},800)}
function showGuide(it){BGM.stop();var ov=document.createElement('div');ov.className='guide';ov.innerHTML='<div class="guide-card"><div class="brand-pill">3번 헷갈린 글자</div><h3>「'+esc(it.jp)+'」 획순</h3><div id="stroke" class="stroke"><div style="font-size:120px;font-weight:1000">'+esc(it.jp)+'</div></div><div class="enc">이렇게 쓰는 거야. 넌 할 수 있어! ✨</div><button id="againGuide" class="primary">다시 도전하기 ▶</button></div>';document.body.appendChild(ov);var host=byId('stroke'),ch=it.jp.charAt(0),url='https://raw.githubusercontent.com/zhengkyl/strokesvg/main/dist/hiragana/'+encodeURIComponent(ch)+'.svg';fetch(url).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(svg){host.innerHTML=svg}).catch(function(){});byId('againGuide').onclick=function(){if(ov.parentNode)ov.parentNode.removeChild(ov);BGM.start();nextRound()}}
function finish(){BGM.stop();SFX.clear();var rate=Math.round(G.correct/Math.max(1,G.total)*100),rank=rate>=90?'S':rate>=75?'A':rate>=60?'B':'C';data.sessions.push({date:today(),mode:G.mode,stage:G.stage,correct:G.correct,total:G.total});save();app.innerHTML='<main class="page result"><div class="rank">'+rank+'</div><h1>'+(rank==='S'?'MISSION PERFECT!':'우주 방어 성공!')+'</h1><p>잘했어! 내일 다시 만나면 더 오래 기억해.</p><div class="result-grid"><div class="card"><b>'+G.correct+'</b><small>정답</small></div><div class="card"><b>×'+G.best+'</b><small>최고 콤보</small></div><div class="card"><b>'+rate+'%</b><small>정답률</small></div></div><button id="home" class="primary" style="margin-top:12px">오늘은 여기까지 ✓</button>'+footer()+'</main>';byId('home').onclick=renderHome}
function seedQA(){data=fresh();data.profile={name:'Sunny',age:8};data.unlockedStage=4;data.selectedStage=1;save()}function qaMode(){var m=location.search.match(/[?&]qa=([^&]+)/);return m?decodeURIComponent(m[1]):''}window.__HIRAGANADA_QA={version:VERSION,ta:ITEMS.filter(function(x){return x.group==='타행'}).map(function(x){return x.jp+':'+x.ko}).join('|'),choiceCounts:[choiceCount(1),choiceCount(2),choiceCount(3)],noTiTeu:ITEMS.every(function(x){return x.ko!=='티'&&x.ko!=='트'})};window.__HIRAGANADA_READY=true;function boot(){var m=qaMode();if(m){seedQA();if(m==='home'){renderHome();return}if(m==='game'){G={mode:'defense',stage:1,total:10,round:6,correct:5,lives:3,combo:12,best:12,recent:[],current:ITEMS.filter(function(x){return x.jp==='た'})[0],confidence:null};renderDefense();return}if(m==='guide'){renderHome();showGuide(ITEMS.filter(function(x){return x.jp==='た'})[0]);return}}if(data.profile)renderHome();else renderWelcome()}window.onerror=function(msg,url,line,col,err){app.innerHTML='<main class="page"><section class="card"><h2>앱 오류</h2><pre style="white-space:pre-wrap">'+esc(err&&err.stack?err.stack:String(msg)+' @ '+line+':'+col)+'</pre></section></main>'};boot();
})();
</script>
