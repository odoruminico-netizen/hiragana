function guideChars(item){var a=[];for(var i=0;i<item.jp.length;i++){var ch=item.jp.charAt(i);if(ch==='ー')continue;a.push(ch)}return a.length?a:[item.jp]}
function showStrokeGuide(item,done){BGM.stop();var chars=guideChars(item),idx=0,overlay=document.createElement('div');overlay.className='guide-overlay';overlay.innerHTML='<div class="guide-card"><div class="logo-pill">3번 헷갈린 글자 · 획순 구조대</div><h3 id="guideTitle"></h3><p style="margin:3px 0;font-size:12px;font-weight:800">획이 하나씩 나타나는 순서를 천천히 봐.</p><div id="strokeHost" class="stroke-host"><div class="fallback-glyph">'+esc(chars[0])+'</div></div><div id="guideProg" class="guide-progress"></div><div class="encourage">이렇게 쓰는 거야. 넌 할 수 있어! ✨</div><button id="replay" class="secondary" style="margin-bottom:8px">↻ 획순 다시 보기</button><button id="guideNext" class="primary">'+(chars.length>1?'다음 글자':'다시 도전하기')+' ▶</button><div style="font-size:7px;margin-top:7px;color:#71827b">Stroke data: strokesvg / Klee One</div></div>';document.body.appendChild(overlay);function loadOne(){var ch=chars[idx],host=byId('strokeHost');byId('guideTitle').textContent='「'+ch+'」 '+(idx+1)+'/'+chars.length;byId('guideProg').textContent=item.jp+' · '+item.ko;host.innerHTML='<div style="font-size:11px;font-weight:900">획순 불러오는 중…</div>';var ck='hiraganada-stroke-'+ch,cached=null;try{cached=localStorage.getItem(ck)}catch(e){}if(cached){host.innerHTML=cached;restartStrokeAnimation(host);return}fetch('https://raw.githubusercontent.com/zhengkyl/strokesvg/main/dist/hiragana/'+encodeURIComponent(ch)+'.svg',{cache:'force-cache'}).then(function(r){if(!r.ok)throw new Error('stroke '+r.status);return r.text()}).then(function(svg){try{localStorage.setItem(ck,svg)}catch(e){}host.innerHTML=svg;restartStrokeAnimation(host)}).catch(function(){host.innerHTML='<div><div class="fallback-glyph">'+esc(ch)+'</div><small>획순 데이터를 불러오지 못했어.<br>인터넷 연결 후 다시 누르면 실제 획순을 볼 수 있어.</small></div>'})}function restartStrokeAnimation(host){var svg=q('svg',host);if(!svg)return;var clone=svg.cloneNode(true);host.innerHTML='';host.appendChild(clone)}byId('replay').onclick=function(){loadOne()};byId('guideNext').onclick=function(){idx++;if(idx<chars.length){loadOne();this.textContent=(idx===chars.length-1?'다시 도전하기':'다음 글자')+' ▶'}else{if(overlay.parentNode)overlay.parentNode.removeChild(overlay);BGM.start();done()}};loadOne()}
function finishGame(){BGM.stop();SFX.clear();var rate=Math.round(G.correct/Math.max(1,(G.mode==='boss'?G.bossMax:G.total))*100),rank=rate>=90?'S':rate>=75?'A':rate>=60?'B':'C';data.sessions.push({date:today(),mode:G.mode,stage:G.stage,correct:G.correct,total:G.total,bestCombo:G.bestCombo,score:data.score});save();app.innerHTML='<main class="page result">'+hud()+'<div class="result-badge">'+rank+'</div><h2>'+(rank==='S'?'MISSION PERFECT!':rank==='A'?'우주 방어 성공!':'오늘 기억도 성장했어!')+'</h2><p style="color:#cae8f1;font-size:12px">짧게 집중하고 내일 다시 만나면 기억이 더 단단해져.</p><div class="result-grid"><div class="card"><b>'+G.correct+'</b><small>정답</small></div><div class="card"><b>×'+G.bestCombo+'</b><small>최고 콤보</small></div><div class="card"><b>'+rate+'%</b><small>정답률</small></div></div><section class="card" style="margin-top:10px"><b>🧠 메타인지 복습</b><p style="font-size:11px">자신 있다고 했는데 틀린 글자는 다음 임무에서 우선 다시 만나게 돼.</p></section><button id="again" class="primary" style="margin-top:10px">같은 임무 다시 ▶</button><button id="home" class="secondary" style="margin-top:8px">오늘은 여기까지</button>'+footer()+'</main>';bindTrack();byId('again').onclick=function(){audio();BGM.start();startGame(G.mode)};byId('home').onclick=renderHome}
function selfTest(){var tests=[];function T(n,o){tests.push({name:n,ok:!!o})}var ta=ITEMS.filter(function(x){return x.group==='ta'});T('타치츠테토 매핑',ta.map(function(x){return x.jp+':'+x.ko}).join('|')==='た:타|ち:치|つ:츠|て:테|と:토');T('Stage1 excludes を/ん/わ',stageItems(1).every(function(x){return x.jp!=='を'&&x.jp!=='ん'&&x.jp!=='わ'}));T('Stage3 no っ/ん',stageItems(3).every(function(x){return x.jp.indexOf('っ')<0&&x.jp.indexOf('ん')<0}));T('Stage4 has っ or ん',stageItems(4).every(function(x){return x.jp.indexOf('っ')>=0||x.jp.indexOf('ん')>=0}));T('50 distinct BGM',TRACKS.length===50&&new Set(TRACKS.map(function(x){return x.name})).size===50&&new Set(TRACKS.map(function(x){return x.leadA.join(',')+'|'+x.leadB.join(',')+'|'+x.bass.join(',')+'|'+x.tempo})).size===50);T('Initial Stage1 pool is あ row only',activePool(1).map(function(x){return x.jp}).join('')==='あいうえお');T('Stage2 starts が row',activePool(2).map(function(x){return x.jp}).join('')==='がぎぐげご');T('No 티/트 reading',ITEMS.every(function(x){return x.ko!=='티'&&x.ko!=='트'}));T('ages 8-13',difficulty().age>=8&&difficulty().age<=13);return tests}
function getQA(){var m=location.search.match(/[?&]qa=([^&]+)/);return m?decodeURIComponent(m[1]):''}function seedQA(){data.profile={name:'Sunny',age:10};data.skin=0;data.selectedStage=1;data.unlockedStage=4;save()}
function boot(){window.__HIRAGANADA_TESTS=selfTest();var qaMode=getQA();if(qaMode){seedQA();if(qaMode==='home'){renderHome();return}if(qaMode==='defense'){BGM.stop();startGame('defense');return}if(qaMode==='type'){BGM.stop();startGame('type');return}if(qaMode==='boss'){BGM.stop();startGame('boss');return}if(qaMode==='guide'){renderHome();showStrokeGuide(stageItems(1)[0],function(){});return}}if(data.profile)renderHome();else renderWelcome()}window.onerror=function(msg,url,line,col,err){app.innerHTML='<main class="page"><section class="card"><h2>앱 오류</h2><pre style="white-space:pre-wrap">'+esc(err&&err.stack?err.stack:String(msg)+' @ '+line+':'+col)+'</pre></section></main>'};boot();
})();
</script></body></html>
